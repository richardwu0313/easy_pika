[project]
name = "easypika"
version = "0.7.0"
authors = [{name = "Richar Wu", email = "richard_wu0313@hotmail.com"}]
description = "user-friendly pika library"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.3",
    "pika>=1.3.2",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]  # 当前目录
include = ["easy_pika*"]  # 明确包含 easy_pika 包
